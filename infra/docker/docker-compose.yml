version: "3.9"

# ── Cloud Posture Copilot — Local Dev Stack ───────────────────────────────
# Usage:
#   docker compose -f infra/docker/docker-compose.yml up --build
#
# Services: postgres | api | web
# Phase 2+ will add: redis (job queue), worker (job runner)

services:

  postgres:
    image: postgres:16-alpine
    container_name: cpc_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cloud_posture
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d cloud_posture"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    container_name: cpc_api
    restart: unless-stopped
    environment:
      API_ENV: development
      DATABASE_URL: postgresql+asyncpg://copilot:changeme@postgres:5432/cloud_posture
      SECRET_KEY: dev-only-secret-key-replace-in-production
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "60"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../apps/api:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    image: node:20-alpine
    container_name: cpc_web
    restart: unless-stopped
    working_dir: /app
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ../../apps/web:/app
      - web_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"

volumes:
  postgres_data:
  web_node_modules:
